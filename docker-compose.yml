services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Copy .env.example → .env.local and fill in ANTHROPIC_API_KEY
      - .env.local
    volumes:
      # SQLite db persists across restarts; swap DATABASE_URL for RDS in prod
      - docinfo-data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/local.db

volumes:
  docinfo-data:
